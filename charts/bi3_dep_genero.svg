

<svg width="500"
     height="400"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .tick-label  { font-family: sans-serif; font-size: 12px; fill: #333; }
    .axis-line, .tick-line { stroke: #666; }
    .title       { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #111; }
    .axis-label  { font-family: sans-serif; font-size: 12px; fill: #555; }
    .legend-text { font-family: sans-serif; font-size: 12px; fill: #333; }
    .pct-label   { font-family: sans-serif; font-size: 12px; fill: white; font-weight: bold; }
  </style>

  <g transform="translate(70,50)">

    <text class="title" x="160.0" y="-22" text-anchor="middle">
      Proporción de Depresión por Género
    </text>

    <g transform="translate(0,280)">
      <!-- axis orientation=bottom range=[0,320] ticks=2 -->
  <g class="axis axis-bottom" transform="translate(0, 0)">
    <line class="axis-line" x1="0" y1="0" x2="320" y2="0" stroke="currentColor" stroke-width="1"/>
    <g class="tick" transform="translate(32, 0)">
      <line class="tick-line" x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1"/>
      <text class="tick-label" x="0" y="9" text-anchor="middle" dominant-baseline="hanging" dy="0.15em" >Female</text>
    </g>
    <g class="tick" transform="translate(192, 0)">
